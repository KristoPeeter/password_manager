[package]
name = "password_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = { version = "0.11", features = ["zeroize"]}
arboard = "3.7"
argon2 = { version= "0.6", features = ["zeroize"]}
base64 = "0.23"
inquire = "0.9"
rand = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
zeroize = "1.9"

[dev-dependencies]
tempfile = "3"
