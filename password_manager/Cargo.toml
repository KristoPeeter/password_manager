[package]
name = "password_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = { version = "0.11", features = ["zeroize"]}
arboard = "3.7"
argon2 = { version= "0.6", features = ["zeroize"]}
base64 = "0.23"
dirs = "7.0.0"
hex = "0.4.3"
hmac = "0.13.0"
inquire = "0.9"
rand = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tempfile = "3"
unicode-normalization = "0.1.26"
zeroize = { version = "1.9", features = ["derive"] }

# geteuid without unsafe code; only needed for the unix access checks
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "fs"] }
signal-hook = "0.4.6"
